[project]
name = "span-context-propagator"
version = "0.1.1"
description = "Serializes and deserializes trace_id, span_id, and flags into and from W3C Trace Context and Baggage header formats."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
